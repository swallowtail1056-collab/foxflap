<div id="gameWrapper">
  <div id="scoreBoard">
    <div id="scoreLeft">
      <span><span id="labelScore">スコア</span> <span id="score">0</span></span>
      <span><span id="labelBest">最高</span> <span id="best">0</span></span>
    </div>
    <div id="langBar">
      <button class="langBtn active" id="btnJa" onclick="setLang('ja')">🇯🇵</button>
      <button class="langBtn" id="btnEn" onclick="setLang('en')">🇬🇧</button>
    </div>
  </div>
  <canvas id="canvas" width="360" height="560"></canvas>
  <div id="hint">クリック / スペース / タップ でジャンプ</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Palette ──────────────────────────────────────
const SKY_TOP    = '#87ceeb';
const SKY_BOT    = '#c8e8f0';
const GROUND_COL = '#6b3d1e';
const GRASS_COL  = '#3a7d2c';

// ── Language ─────────────────────────────────────
let LANG = 'ja';
const T = {
  ja: {
    score: 'スコア', best: '最高',
    hint: 'クリック / スペース / タップ でジャンプ',
    title: 'Foxy Flap 🦊',
    start: 'タップしてスタート！',
    startSub: 'Click / Space / Tap',
    dead: '💥 やられた！',
    newRecord: '🎉 新記録！',
    retry: 'タップして もう一度',
  },
  en: {
    score: 'Score', best: 'Best',
    hint: 'Click / Space / Tap to jump',
    title: 'Foxy Flap 🦊',
    start: 'Tap to Start!',
    startSub: 'Click / Space / Tap',
    dead: '💥 Game Over!',
    newRecord: '🎉 New Record!',
    retry: 'Tap to Play Again',
  }
};
function setLang(lang) {
  LANG = lang;
  document.getElementById('btnJa').classList.toggle('active', lang === 'ja');
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');
  document.getElementById('labelScore').textContent = T[lang].score;
  document.getElementById('labelBest').textContent = T[lang].best;
  document.getElementById('hint').textContent = T[lang].hint;
  if (state === 'idle' || state === 'dead') {
    drawBg();
    for (const p of pipes) drawPipe(p.x, p.top, p.idx, p.gap || PIPE_GAP);
    drawFox(fox.x, fox.y, fox.vy);
    if (state === 'idle') drawIdle();
    if (state === 'dead') drawDead();
  }
}
function t(key) { return T[LANG][key]; }

// ── State ─────────────────────────────────────────
let state = 'idle'; // idle | playing | dead
let score = 0, best = 0;

// Fox
let fox = { x: 80, y: H/2, vy: 0, r: 18 };
const GRAVITY  = 0.38;
const JUMP_V   = -7;

// Pipes
let pipes = [];
const PIPE_W    = 48;
const PIPE_GAP  = 200;
const PIPE_SPD  = 1.6;
let pipeTimer   = 0;
const PIPE_INT  = 135;  // frames between pipes

// Ground
const GROUND_H  = 60;
const GY        = H - GROUND_H;

// ── Input ─────────────────────────────────────────
function jump() {
  if (state === 'idle') { state = 'playing'; startBGM(); }
  if (state === 'playing') { fox.vy = JUMP_V; playFlap(); }
  if (state === 'dead') { restart(); }
}
canvas.addEventListener('click', jump);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});
canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, {passive:false});

// ── Audio ─────────────────────────────────────────
let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playFlap() {
  try {
    const ac = getAudio();
    const o = ac.createOscillator(); const g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.setValueAtTime(500, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(750, ac.currentTime + 0.06);
    g.gain.setValueAtTime(0.12, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.1);
    o.start(); o.stop(ac.currentTime + 0.1);
  } catch(e) {}
}
function playScore() {
  try {
    const ac = getAudio();
    [523, 659, 784].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.frequency.value = f; o.type = 'sine';
      const t = ac.currentTime + i * 0.08;
      g.gain.setValueAtTime(0.1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o.start(t); o.stop(t + 0.12);
    });
  } catch(e) {}
}
function playDie() {
  try {
    const ac = getAudio();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.setValueAtTime(260, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(70, ac.currentTime + 0.3);
    g.gain.setValueAtTime(0.2, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.35);
    o.start(); o.stop(ac.currentTime + 0.35);
  } catch(e) {}
}

// ── BGM (落ち着いたソフトなアコースティック調) ───────────────────
let bgmTimer = null;
let bgmPlaying = false;

// 低めの柔らかい音階 (周波数Hz, 長さ秒) - 三角波(triangle)で温かみのある音
const CALM_MELODY = [
  [329.63, 0.4], [392.00, 0.4], [440.00, 0.4], [523.25, 0.8],
  [440.00, 0.4], [392.00, 0.8],
  [329.63, 0.4], [293.66, 0.4], [261.63, 0.8],
  [293.66, 0.4], [329.63, 0.8]
];

function startBGM() {
  stopBGM(); // 既存のタイマーや再生を確実に停止（輪唱防止）
  bgmPlaying = true;
  try {
    const ac = getAudio();
    playCalmLoop(ac);
  } catch(e) {}
}

function playCalmLoop(ac) {
  if (!bgmPlaying) return;
  let t = ac.currentTime + 0.05;
  const master = ac.createGain();
  master.gain.value = 0.06; // 全体音量をかなり抑えめに調整
  master.connect(ac.destination);

  let totalDur = 0;
  CALM_MELODY.forEach(([freq, dur]) => {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'triangle'; // 刺さらない丸い音色
    o.frequency.value = freq;
    
    // なめらかなエンベロープ（耳障りなクリック音・セミ鳴き声を防止）
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.08);
    g.gain.setValueAtTime(0.15, t + dur - 0.1);
    g.gain.linearRampToValueAtTime(0, t + dur);
    
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
    t += dur;
    totalDur += dur;
  });

  // ループが重複しないよう、タイマー管理を一本化
  bgmTimer = setTimeout(() => {
    if (bgmPlaying) playCalmLoop(ac);
  }, totalDur * 1000);
}

function stopBGM() {
  bgmPlaying = false;
  if (bgmTimer) {
    clearTimeout(bgmTimer);
    bgmTimer = null;
  }
}

// ── Images (キャッシュ強制破棄) ────────────────────
const v = Date.now();
const jennyImg = new Image();
jennyImg.src = './jenny.png?v=' + v;

const bgImg = new Image();
bgImg.src = './bg_forest.png?v=' + v;

function drawFox(x, y, vy) {
  ctx.save();
  const tilt = Math.max(-25, Math.min(25, vy * 3));
  ctx.translate(x, y);
  ctx.rotate(tilt * Math.PI / 180);
  const w = 60, h = 80;
  ctx.drawImage(jennyImg, -w/2, -h/2, w, h);
  ctx.restore();
}

// ── Obstacle drawing ──────────────────────────────
function drawPipe(px, topH, idx, gap) {
  gap = gap || PIPE_GAP;
  const botY = topH + gap;
  const type = idx % 2 === 0 ? 'tree' : 'brick';

  if (type === 'tree') {
    drawTree(px, topH, true);
    drawTree(px, botY, false);
  } else {
    drawBrick(px, topH, true);
    drawBrick(px, botY, false);
  }
}

function drawTree(px, endY, fromTop) {
  const tw = PIPE_W;
  const tg = ctx.createLinearGradient(px, 0, px + tw, 0);
  tg.addColorStop(0, '#8B5E3C'); tg.addColorStop(0.4, '#a0724a'); tg.addColorStop(1, '#6b3d1e');
  ctx.fillStyle = tg;
  if (fromTop) {
    ctx.fillRect(px + 10, 0, tw - 20, endY - 30);
  } else {
    ctx.fillRect(px + 10, endY + 30, tw - 20, GY - endY - 30);
  }

  const leafColors = ['#2d6e1a', '#3a8c22', '#4aaa2e'];
  const cx = px + tw / 2;
  if (fromTop) {
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = leafColors[i];
      ctx.beginPath();
      const fy = endY - 30 - i * 22;
      ctx.moveTo(cx, fy - 36);
      ctx.lineTo(cx - tw/2 - 8 + i*4, fy + 4);
      ctx.lineTo(cx + tw/2 + 8 - i*4, fy + 4);
      ctx.closePath();
      ctx.fill();
    }
  } else {
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = leafColors[i];
      ctx.beginPath();
      const fy = endY + 30 + i * 22;
      ctx.moveTo(cx, fy + 36);
      ctx.lineTo(cx - tw/2 - 8 + i*4, fy - 4);
      ctx.lineTo(cx + tw/2 + 8 - i*4, fy - 4);
      ctx.closePath();
      ctx.fill();
    }
  }
}

function drawBrick(px, endY, fromTop) {
  const tw = PIPE_W;
  const brickH = 14, brickW = 22;
  const drawBricks = (y1, y2) => {
    ctx.fillStyle = '#b5451b';
    ctx.fillRect(px, y1, tw, y2 - y1);
    for (let row = y1; row < y2; row += brickH) {
      const offset = Math.floor((row - y1) / brickH) % 2 === 0 ? 0 : brickW / 2;
      ctx.strokeStyle = '#7a2e0e';
      ctx.lineWidth = 1.5;
      for (let col = px - offset; col < px + tw; col += brickW) {
        ctx.strokeRect(col, row, brickW, brickH);
      }
      ctx.beginPath(); ctx.moveTo(px, row); ctx.lineTo(px + tw, row);
      ctx.stroke();
    }
  };
  const capH = 10;
  if (fromTop) {
    drawBricks(0, endY - capH);
    ctx.fillStyle = '#4aaa2e';
    ctx.fillRect(px - 4, endY - capH, tw + 8, capH + 2);
  } else {
    drawBricks(endY + capH, GY);
    ctx.fillStyle = '#4aaa2e';
    ctx.fillRect(px - 4, endY - 2, tw + 8, capH + 2);
  }
}

// ── Background ────────────────────────────────────
let bgOff = 0;
let groundOff = 0;

function drawBg() {
  const spd = state === 'playing' ? PIPE_SPD * 0.4 : 0;
  bgOff = (bgOff + spd) % 720;
  if (bgImg.complete && bgImg.naturalWidth > 0) {
    ctx.drawImage(bgImg, -bgOff, 0, 720, GY);
    ctx.drawImage(bgImg, 720 - bgOff, 0, 720, GY);
  } else {
    ctx.fillStyle = '#2d6e1a';
    ctx.fillRect(0, 0, W, GY);
  }

  ctx.fillStyle = '#5a8a1a';
  ctx.fillRect(0, GY, W, GROUND_H);

  groundOff = (groundOff + (state === 'playing' ? PIPE_SPD : 0)) % 18;
  const grassHeights = [32, 22, 40, 26, 36, 20, 30, 38, 28, 34, 22, 42, 24, 36];
  for (let gx = -groundOff - 18; gx < W + 18; gx += 6) {
    const hi = Math.floor((gx + groundOff) / 6 + 100) % grassHeights.length;
    const gh = grassHeights[hi];
    const sway = Math.sin((gx + groundOff) * 0.15 + Date.now() * 0.001) * 5;
    ctx.strokeStyle = (hi % 3 === 0) ? '#3a9e1a' : (hi % 3 === 1) ? '#5abf2e' : '#4aaa22';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(gx + 3, GY + 2);
    ctx.quadraticCurveTo(gx + 3 + sway * 0.6, GY - gh * 0.5, gx + 3 + sway, GY - gh);
    ctx.stroke();
  }
}

// ── Overlay ───────────────────────────────────────
function drawIdle() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.roundRect(W/2 - 110, H/2 - 70, 220, 130, 16);
  ctx.fill();

  ctx.fillStyle = '#ffd97d';
  ctx.font = 'bold 32px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Foxy Flap 🦊', W/2, H/2 - 22);

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '16px "Segoe UI", sans-serif';
  ctx.fillText(t('start'), W/2, H/2 + 16);
  ctx.fillText(t('startSub'), W/2, H/2 + 38);
}

function drawDead() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.roundRect(W/2 - 120, H/2 - 90, 240, 165, 16);
  ctx.fill();

  ctx.fillStyle = '#ff6b6b';
  ctx.font = 'bold 30px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(t('dead'), W/2, H/2 - 45);

  ctx.fillStyle = '#ffd97d';
  ctx.font = 'bold 22px "Segoe UI", sans-serif';
  ctx.fillText(`${t('score')}: ${score}`, W/2, H/2 - 8);

  if (score >= best) {
    ctx.fillStyle = '#a8e063';
    ctx.font = 'bold 15px "Segoe UI", sans-serif';
    ctx.fillText(t('newRecord'), W/2
